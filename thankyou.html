<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Thank You – Solar Cleaning Specialists</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --sun: #F5B800; --dark: #0A1628; --mid: #112240; --white: #FFFFFF; }
    body { font-family: 'DM Sans', sans-serif; background: var(--dark); color: var(--white); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; text-align: center; }
    @keyframes sunSpin {
      0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.2); } 100% { transform: rotate(360deg) scale(1); }
    }
    .sun { display: inline-block; animation: sunSpin 4s linear infinite; font-size: 4rem; margin-bottom: 1.5rem; }
    h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2.5rem, 6vw, 4.5rem); letter-spacing: 3px; color: var(--sun); margin-bottom: 1rem; }
    p { font-size: 1.05rem; font-weight: 300; color: rgba(255,255,255,0.75); max-width: 500px; line-height: 1.8; margin-bottom: 0.6rem; }
    p strong { color: var(--white); }
    .divider { width: 60px; height: 2px; background: var(--sun); margin: 1.5rem auto; }
    .btn { display: inline-block; margin-top: 2rem; background: var(--sun); color: var(--dark); padding: 0.9rem 2.5rem; font-weight: 700; font-size: 0.9rem; letter-spacing: 1.5px; text-transform: uppercase; text-decoration: none; border-radius: 2px; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="sun">☀️</div>
  <h1>Request Received!</h1>
  <div class="divider"></div>
  <p>Thank you for reaching out to <strong>Solar Cleaning Specialists</strong>!</p>
  <p>We've received your quote request and will be in touch with you shortly.</p>
  <p>For immediate assistance, call or text us at <strong>(443) 752-3078</strong>.</p>
  <a href="solar-clean.html" class="btn">← Back to Home</a>
</body>
</html>
